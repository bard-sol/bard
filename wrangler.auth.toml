name = "bard-auth"
main = "auth-worker.js"
compatibility_date = "2024-01-01"

# Separate deployment from the bard.is worker. X redirects here.
# Set X_CLIENT_ID, X_CLIENT_SECRET, X_OAUTH_STATE_SECRET (or SUPABASE_JWT_SECRET),
# SUPABASE_URL, and SUPABASE_SERVICE_ROLE_KEY on the worker.
# Do not deploy this from a task that was not asked to ship it.
# The callback writes holders.x_handle, x_linked_at, and x_via = oauth
# with the service key. It does not write show_handle.
