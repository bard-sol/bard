<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bard — receipt</title>
<meta name="description" content="The frozen payout receipt for a Bard campaign.">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1c1e26;
  --surface:#262930;
  --purple:#a78bfa;
  --text:#f4f4f5;
  --muted:#a1a1aa;
  --body:#d5d5da;
  --line:rgba(244,244,245,.08);
  --purple-soft:rgba(167,139,250,.12);
  --font:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
  --r:12px;
  --gutter:clamp(18px,4vw,40px);
  --max:760px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--font);font-size:16px;line-height:1.6;
  font-variation-settings:"wdth" 100,"wght" 420;
  -webkit-font-smoothing:antialiased;min-height:100vh;
}
img{display:block;max-width:100%}
a{color:var(--purple);text-decoration:none}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.head{
  position:sticky;top:0;z-index:40;
  background:rgba(28,30,38,.9);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.head__in{
  display:flex;align-items:center;gap:20px;
  min-height:72px;max-width:1080px;margin:0 auto;padding:10px var(--gutter);
}
.mark{
  display:inline-flex;flex-direction:column;align-items:center;
  gap:2px;margin-right:auto;line-height:1;text-align:center;color:var(--text);
}
.mark__word{font-size:1.15rem;font-variation-settings:"wdth" 112,"wght" 720;letter-spacing:-.015em}
.mark__smile{width:26px;height:16px;object-fit:contain}
.head__link{font-size:.9rem;color:var(--muted);padding:8px 12px;border-radius:8px}
.main{max-width:var(--max);margin:0 auto;padding:clamp(28px,5vw,48px) var(--gutter) 80px}
h1{
  margin:0 0 8px;font-size:clamp(1.6rem,3.4vw,2.2rem);line-height:1.2;
  font-variation-settings:"wdth" 108,"wght" 700;letter-spacing:-.025em;
}
.line{margin:0 0 10px;color:var(--body)}
.card{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:16px 18px;margin-top:18px;
}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-size:.75rem;font-weight:500}
td.num,th.num{text-align:right}
tr.is-you{background:var(--purple-soft)}
.sig{word-break:break-all}
[hidden]{display:none !important}
</style>
</head>
<body>
<header class="head">
  <div class="head__in">
    <a class="mark" href="/" aria-label="Bard home">
      <span class="mark__word">Bard</span>
      <img class="mark__smile" src="/transparentbardsmile.png" alt="">
    </a>
    <a class="head__link" href="/explore.html">Explore</a>
    <a class="head__link" href="/dashboard.html">Dashboard</a>
  </div>
</header>
<main class="main">
  <p class="muted" id="kicker">Receipt</p>
  <h1 id="title">Payout receipt</h1>
  <p class="line" id="paid-on"></p>
  <p class="line sig" id="tx-line"></p>
  <p class="line" id="unverified" hidden>This payout could not be verified on chain</p>
  <p class="muted" id="unverified-reason" hidden></p>
  <div class="card" id="table-card" hidden>
    <table>
      <thead>
        <tr><th class="num">Rank</th><th>Holder</th><th class="num">Amount</th></tr>
      </thead>
      <tbody id="receipt-rows"></tbody>
    </table>
    <p class="line num" id="receipt-total"></p>
  </div>
  <div class="card" id="draw-block" hidden>
    <p class="muted">Draw</p>
    <p class="line num" id="draw-slot"></p>
    <p class="line sig" id="draw-seed"></p>
    <p class="line num" id="draw-seed-slot"></p>
    <ul id="draw-winners"></ul>
  </div>
</main>
<script src="/platform.js"></script>
<script>
(function () {
  function campaignId() {
    var match = location.pathname.match(/^\/c\/([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})\/receipt\/?$/i);
    return match ? match[1] : '';
  }

  function peekWallet() {
    try {
      var provider = (window.phantom && window.phantom.solana) || window.solflare || window.solana;
      if (provider && provider.publicKey && provider.publicKey.toString) return provider.publicKey.toString();
    } catch (err) {}
    return '';
  }

  function showUnverified(reason) {
    var box = document.getElementById('unverified');
    var why = document.getElementById('unverified-reason');
    box.hidden = false;
    if (reason) {
      why.hidden = false;
      why.textContent = String(reason);
    }
    document.getElementById('table-card').hidden = true;
    document.getElementById('receipt-rows').textContent = '';
    document.getElementById('draw-block').hidden = true;
  }

  function holderName(row) {
    if (row.is_platform_cut) return 'Bard cut';
    return row.handle || row.wallet_short || '—';
  }

  function render(body) {
    var campaign = body.campaign || {};
    var project = campaign.project || {};
    var title = campaign.title || 'Payout receipt';
    document.getElementById('title').textContent = title;
    var ticker = project.ticker ? (' · $' + project.ticker) : '';
    document.getElementById('kicker').textContent = (project.name || 'Receipt') + ticker;
    var paid = document.getElementById('paid-on');
    var when = body.settlement && body.settlement.executed_at;
    paid.textContent = when && window.BardPlatform && BardPlatform.clockDate
      ? ('Paid on ' + BardPlatform.clockDate(when))
      : (when ? ('Paid on ' + when) : '');
    var tx = document.getElementById('tx-line');
    tx.textContent = '';
    var signature = body.settlement && body.settlement.tx_signature;
    if (signature) {
      tx.append(document.createTextNode(signature));
      var href = window.BardPlatform && BardPlatform.safeHttpUrl(body.settlement.explorer_url);
      if (href) {
        tx.append(document.createTextNode(' · '));
        var link = document.createElement('a');
        link.id = 'tx-link';
        link.href = href;
        link.target = '_blank';
        link.rel = 'noopener';
        link.textContent = 'view on explorer';
        tx.append(link);
      }
    }
    var rows = document.getElementById('receipt-rows');
    rows.textContent = '';
    (body.rows || []).forEach(function (row) {
      var tr = document.createElement('tr');
      tr.setAttribute('data-wallet-hash', row.wallet_hash || '');
      if (row.is_platform_cut) tr.setAttribute('data-cut', '1');
      var rank = document.createElement('td');
      rank.className = 'num';
      rank.textContent = row.rank == null ? '' : String(row.rank);
      var who = document.createElement('td');
      who.textContent = holderName(row);
      var amount = document.createElement('td');
      amount.className = 'num';
      amount.textContent = (row.amount || '') + (body.unit ? (' ' + body.unit) : '');
      tr.append(rank, who, amount);
      rows.append(tr);
    });
    document.getElementById('table-card').hidden = false;
    var total = document.getElementById('receipt-total');
    var totalText = body.total_raw || '0';
    if (window.BardPlatform && BardPlatform.formatRaw && body.decimals != null) {
      totalText = BardPlatform.formatRaw(body.total_raw, body.decimals);
    }
    total.textContent = 'Total ' + totalText + (body.unit ? (' ' + body.unit) : '');
    var draw = body.draw;
    var block = document.getElementById('draw-block');
    if (!draw) {
      block.hidden = true;
      return;
    }
    block.hidden = false;
    document.getElementById('draw-slot').textContent = 'Slot ' + (draw.slot == null ? '—' : String(draw.slot));
    document.getElementById('draw-seed').textContent = 'Seed ' + (draw.seed || '—');
    document.getElementById('draw-seed-slot').textContent = 'Seed slot ' + (draw.seed_slot == null ? '—' : String(draw.seed_slot));
    var list = document.getElementById('draw-winners');
    list.textContent = '';
    (draw.winners || []).forEach(function (winner) {
      var item = document.createElement('li');
      item.textContent = winner;
      list.append(item);
    });
  }

  function highlight(wallet) {
    if (!wallet || !window.BardPlatform || !BardPlatform.sha256Hex) return;
    var hash = BardPlatform.sha256Hex(wallet);
    document.querySelectorAll('[data-wallet-hash]').forEach(function (row) {
      if (row.getAttribute('data-wallet-hash') === hash) row.classList.add('is-you');
    });
  }

  async function load() {
    var id = campaignId();
    if (!id) {
      showUnverified('');
      return;
    }
    var res;
    try {
      res = await fetch('/api/campaigns/' + encodeURIComponent(id) + '/receipt');
    } catch (err) {
      showUnverified('');
      return;
    }
    var body = {};
    try { body = await res.json(); } catch (err) { body = {}; }
    if (res.status === 409) {
      showUnverified(body.reason || '');
      return;
    }
    if (!res.ok || !body.rows) {
      document.getElementById('title').textContent = 'Receipt not found';
      showUnverified('');
      document.getElementById('unverified').hidden = true;
      return;
    }
    render(body);
    highlight(peekWallet());
  }

  load();
})();
</script>
</body>
</html>
