name: restore-vest-removal
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-vest-removal.yml'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore and patch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/bard-sol/bard.git"
          GOOD=5443ca174f8a06a0c81e6cd3f6b6f6196e29f743
          git checkout "$GOOD" -- admin.html admin_app.js platform.js
          python3 <<'PY'
          from pathlib import Path
          import re

          html = Path('admin.html').read_text()
          html2, n = re.subn(
              r'<button type="button" class="choice" data-reward="vested"><strong>Vested</strong><span>[^<]*</span></button>\s*',
              '',
              html,
              count=1,
          )
          print('vested buttons removed', n)
          html2 = html2.replace('No growing / vested / shared prize pools', 'No growing / shared / top-3 prize pools')
          html2 = html2.replace('Vested unlocks, shared pool, top 3 podium', 'Shared pool, top 3 podium, growing pool that accumulates')
          if 'data-reward="vested"' in html2:
              raise SystemExit('vested button still present')
          Path('admin.html').write_text(html2)

          js = Path('admin_app.js').read_text()
          js = js.replace(",vested:'Vested'", '')
          js = js.replace(",vested:'vested'", '')
          js = js.replace('Growing / vested / shared / top 3', 'Growing / shared / top 3')
          # neutralize vested teach branch if present
          js = js.replace(
              "<b>Vested — Premium.</b> Total amount unlocks over the window you set, weekly.",
              "<b>Fixed.</b> Every qualified holder gets the same payout.",
          )
          js = js.replace("Total vested amount", "Payout per winner")
          js = js.replace("Unlock window (days)", "Max budget (optional)")
          js = js.replace("Payouts unlock over this many days.", "Stop paying once this is gone.")
          Path('admin_app.js').write_text(js)

          p = Path('platform.js').read_text()
          p = p.replace(', vested: true', '')
          p = p.replace(',vested: true', '')
          if 'vested: true' in p:
              raise SystemExit('vested still in platform.js')
          Path('platform.js').write_text(p)
          print('all patched')
          PY
          git config user.name 'bard-sol'
          git config user.email 'bardsoltoken@gmail.com'
          git add admin.html admin_app.js platform.js
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Remove separate Vested reward model; vesting belongs inside Growing only'
            git push origin HEAD:main
          fi
