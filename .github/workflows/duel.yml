name: duel
on:
  push:
    paths:
      - 'duel/**'
      - '.github/workflows/duel.yml'
  pull_request:
    paths:
      - 'duel/**'
      - '.github/workflows/duel.yml'
jobs:
  parity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: duel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Engine parity (v1 and v1.1 goldens)
        run: node engine/parity.mjs
      - name: Gameplay v1.1 parity
        run: node engine/v1.1/parity.mjs
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build worker
        run: npm run build:worker
