<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BARD - Storytelling Meme Coin on Solana</title>

  <link rel="icon" type="image/png" href="bard-creature.png">

  <style>
    :root {
      --bg: #d0c0ff;
      --text: #2a0040;
      --accent: #8a2be2;
      --section-bg: rgba(200, 184, 255, 0.15);
      --border: rgba(138, 43, 226, 0.2);
      --link-bg: rgba(138, 43, 226, 0.12);
    }
    [data-theme="dark"] {
      --bg: #0a001f;
      --text: #e0d0ff;
      --accent: #c084fc;
      --section-bg: rgba(30, 10, 60, 0.6);
      --border: rgba(192, 132, 252, 0.3);
      --link-bg: rgba(192, 132, 252, 0.15);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
      position: relative;
      min-height: 100vh;
      transition: background 0.4s, color 0.4s;
    }

    .hero {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 40px;
      position: relative;
      overflow: hidden;
      padding: 20px;
    }

    .title {
      font-size: clamp(4rem, 12vw, 8rem);
      font-weight: 900;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      text-shadow: 0 0 40px rgba(138, 43, 226, 0.5);
      opacity: 0.92;
      line-height: 0.9;
    }

    .creature {
      max-width: 50vw;
      max-height: 45vh;
      width: auto;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 20px 80px rgba(75, 0, 130, 0.7)) 
              drop-shadow(0 0 50px rgba(138, 43, 226, 0.5));
      animation: gentle-bob 16s infinite ease-in-out;
      cursor: grab;
      user-select: none;
      -webkit-user-drag: none;
      touch-action: pan-y;
      pointer-events: auto;
    }

    .creature:active, .creature.grabbing {
      cursor: grabbing;
    }

    @keyframes gentle-bob {
      0%, 100% { transform: translateY(0) scale(1); }
      50%      { transform: translateY(-25px) scale(1.02); }
    }

    nav { position: absolute; bottom: 60px; z-index: 10; }
    nav a {
      color: var(--text);
      text-decoration: none;
      font-size: 1.1rem;
      margin: 0 15px;
      letter-spacing: 0.1em;
      opacity: 0.85;
      transition: opacity 0.3s;
    }
    nav a:hover { opacity: 1; }

    section {
      padding: 80px 20px;
      max-width: 900px;
      margin: 0 auto;
      background: var(--section-bg);
      border-top: 1px solid var(--border);
    }

    h2 { font-size: 2.5rem; margin-bottom: 30px; letter-spacing: 0.2em; text-shadow: 0 0 20px var(--accent); }

    p, ul { font-size: 1.1rem; line-height: 1.6; margin-bottom: 25px; opacity: 0.9; }

    ul {
      list-style-type: none;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }

    .meme-link {
      display: inline-block;
      padding: 14px 28px;
      background: var(--link-bg);
      border: 1px solid var(--accent);
      border-radius: 50px;
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      letter-spacing: 0.08em;
      transition: all 0.4s ease;
      box-shadow: 0 0 15px rgba(138, 43, 226, 0.3);
      position: relative;
      overflow: hidden;
    }

    .meme-link:hover {
      background: rgba(138, 43, 226, 0.25);
      box-shadow: 0 0 35px var(--accent);
      transform: translateY(-3px) scale(1.05);
      color: #fff;
    }

    footer {
      padding: 40px 20px;
      font-size: 0.9rem;
      color: var(--text);
      opacity: 0.7;
    }

    #theme-toggle {
      position: absolute;
      top: 25px;
      right: 25px;
      background: rgba(255,255,255,0.2);
      border: 1px solid var(--accent);
      color: var(--text);
      padding: 10px 18px;
      border-radius: 50px;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.3s;
      backdrop-filter: blur(8px);
      z-index: 100;
    }

    [data-theme="dark"] #theme-toggle {
      background: rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

  <div class="hero">
    <div class="title">BARD</div>
    
    <img src="bard-creature.png" 
         alt="Bard creature" 
         class="creature"
         onerror="this.src='https://pbs.twimg.com/profile_images/2023982637669556224/xP2xeTkY.jpg';">

    <nav>
      <a href="#home">HOME</a> •
      <a href="#explore">EXPLORE</a> •
      <a href="#create">CREATE</a> •
      <a href="#about">ABOUT</a>
    </nav>

    <button id="theme-toggle">🌙 Dark Mode</button>
  </div>

  <!-- Your sections here (unchanged) -->
  <section id="home">...</section>
  <section id="explore">...</section>
  <section id="create">...</section>
  <section id="about">...</section>

  <footer>
    © 2026 BARD • Dubai-born cosmic chaos • Hosted on Cloudflare Pages
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Theme toggle (unchanged)
      const toggle = document.getElementById('theme-toggle');
      const html = document.documentElement;

      function setTheme(theme) {
        html.setAttribute('data-theme', theme);
        localStorage.setItem('theme', theme);
        toggle.textContent = theme === 'dark' ? '☀️ Light Mode' : '🌙 Dark Mode';
      }

      if (localStorage.getItem('theme')) {
        setTheme(localStorage.getItem('theme'));
      } else {
        setTheme(window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      }

      toggle.addEventListener('click', () => {
        const current = html.getAttribute('data-theme');
        setTheme(current === 'dark' ? 'light' : 'dark');
      });

      // Draggable creature
      const creature = document.querySelector('.creature');

      if (creature) {
        let isDragging = false;
        let startX = 0;
        let currentTranslate = 0;
        let prevTranslate = 0;

        const startDrag = (e) => {
          isDragging = true;
          startX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
          creature.style.transition = 'none';
          creature.classList.add('grabbing');
          e.preventDefault(); // prevent scroll/text select
        };

        const onDrag = (e) => {
          if (!isDragging) return;
          const currentX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
          currentTranslate = prevTranslate + currentX - startX;
          creature.style.transform = `translateX(${currentTranslate}px)`;
        };

        const endDrag = () => {
          if (!isDragging) return;
          isDragging = false;
          creature.style.transition = 'transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
          creature.style.transform = 'translateX(0px)';
          creature.classList.remove('grabbing');
          prevTranslate = 0;
        };

        // Mouse events
        creature.addEventListener('mousedown', startDrag);
        document.addEventListener('mousemove', onDrag);
        document.addEventListener('mouseup', endDrag);
        document.addEventListener('mouseleave', endDrag);

        // Touch events
        creature.addEventListener('touchstart', startDrag, { passive: false });
        document.addEventListener('touchmove', onDrag, { passive: false });
        document.addEventListener('touchend', endDrag);
        document.addEventListener('touchcancel', endDrag);

        console.log('Draggable script attached to creature');
      } else {
        console.log('Creature element not found');
      }
    });
  </script>
</body>
</html>
