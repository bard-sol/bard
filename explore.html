<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bard — explore campaigns</title>
<meta name="description" content="Browse live campaigns across Solana projects on Bard.">
<link rel="icon" href="/transparentbardsmile.png" type="image/png">
<link rel="apple-touch-icon" href="/transparentbardsmile.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1c1e26;
  --surface:#262930;
  --surface-2:#2d3039;
  --purple:#a78bfa;
  --text:#f4f4f5;
  --muted:#a1a1aa;
  --body:#d5d5da;
  --line:rgba(244,244,245,.08);
  --line-strong:rgba(244,244,245,.16);
  --purple-soft:rgba(167,139,250,.12);
  --purple-line:rgba(167,139,250,.35);
  --green:#4ade80;
  --font:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
  --r:12px;
  --gutter:clamp(18px,4vw,40px);
  --max:1080px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--font);font-size:16px;line-height:1.6;
  font-variation-settings:"wdth" 100,"wght" 420;
  -webkit-font-smoothing:antialiased;min-height:100vh;
}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--purple);outline-offset:3px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--gutter)}
.head{
  position:sticky;top:0;z-index:40;
  background:rgba(28,30,38,.9);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.head__in{
  display:flex;align-items:center;gap:20px;
  min-height:72px;max-width:var(--max);margin:0 auto;padding:10px var(--gutter);
}
.mark{
  display:inline-flex;flex-direction:column;align-items:center;
  gap:2px;margin-right:auto;line-height:1;text-align:center;
}
.mark__word{
  font-size:1.15rem;font-variation-settings:"wdth" 112,"wght" 720;letter-spacing:-.015em;
}
.mark__smile{width:26px;height:16px;object-fit:contain}
.head__link{
  font-size:.9rem;color:var(--muted);padding:8px 12px;border-radius:8px;
  transition:color .15s,background .15s;
}
.head__link:hover{color:var(--text);background:var(--purple-soft)}
.main{padding:clamp(28px,5vw,48px) 0 80px}
.kicker{font-size:.8rem;color:var(--purple);font-variation-settings:"wght" 600;margin:0 0 10px}
h1{
  margin:0 0 10px;font-size:clamp(1.7rem,3.5vw,2.3rem);line-height:1.15;
  font-variation-settings:"wdth" 108,"wght" 700;letter-spacing:-.025em;
}
.lead{margin:0 0 28px;color:var(--body);max-width:52ch;font-size:1.02rem}
.search{
  display:flex;gap:10px;margin-bottom:22px;flex-wrap:wrap;
}
.search input{
  flex:1;min-width:200px;background:var(--surface-2);border:1px solid var(--line-strong);
  border-radius:9px;padding:11px 14px;color:var(--text);
}
.search input:focus{outline:none;border-color:var(--purple-line)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 20px;border-radius:9px;font-size:.95rem;
  font-variation-settings:"wght" 620;border:1px solid transparent;
  transition:background .15s,border-color .15s,transform .12s;
}
.btn:active{transform:translateY(1px)}
.btn--solid{background:var(--purple);color:#191320}
.btn--solid:hover{background:#b9a3ff}
.btn--ghost{border-color:var(--line-strong);color:var(--text)}
.btn--ghost:hover{border-color:var(--purple-line);background:var(--purple-soft)}
.btn--sm{padding:8px 14px;font-size:.86rem;border-radius:8px}
.card{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:18px 20px;
}
.card + .card{margin-top:10px}
.card--hover{transition:border-color .15s,background .15s;cursor:pointer}
.card--hover:hover{border-color:var(--purple-line);background:var(--surface-2)}
.item{display:flex;align-items:center;gap:14px}
.item__ava{
  width:40px;height:40px;border-radius:10px;background:var(--purple-soft);
  display:grid;place-items:center;color:var(--purple);
  font-size:.85rem;font-variation-settings:"wght" 680;flex:none;
}
.item__body{min-width:0;flex:1}
.item__title{font-size:1rem;font-variation-settings:"wght" 600;line-height:1.3}
.item__sub{font-size:.82rem;color:var(--muted);margin-top:2px}
.item__right{margin-left:auto;text-align:right;flex:none}
.pill{
  display:inline-flex;align-items:center;font-size:.74rem;padding:4px 10px;
  border-radius:99px;font-variation-settings:"wght" 600;white-space:nowrap;
}
.pill--live{background:var(--purple-soft);color:var(--purple)}
.empty{
  text-align:center;padding:48px 24px;
  background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--r);
}
.empty h3{margin:0 0 8px;font-size:1.15rem;font-variation-settings:"wght" 640}
.empty p{margin:0 0 20px;color:var(--muted);max-width:40ch;margin-left:auto;margin-right:auto}
.muted{color:var(--muted)}
</style>
</head>
<body>
  <header class="head">
    <div class="head__in">
      <a class="mark" href="/" aria-label="Bard home">
        <span class="mark__word">Bard</span>
        <img class="mark__smile" src="/transparentbardsmile.png" alt="">
      </a>
      <a class="head__link" href="/dashboard.html">Dashboard</a>
      <a class="head__link" href="/admin.html">For teams</a>
    </div>
  </header>

  <main class="main">
    <div class="wrap">
      <p class="kicker">Public</p>
      <h1>Explore campaigns</h1>
      <p class="lead">Live campaigns from projects onboarded on Bard. Join from the holder dashboard.</p>

      <div class="search">
        <input id="q" type="search" placeholder="Search by project, ticker, or campaign…" autocomplete="off">
        <button class="btn btn--ghost btn--sm" id="btn-refresh">Refresh</button>
      </div>

      <div id="list"></div>
    </div>
  </main>

<script src="/platform.js"></script>
<script>
(function(){
  var all = [];

  function escapeHtml(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>')
      .replace(/"/g,'"');
  }
  function initials(s){
    return String(s || '?').trim().slice(0,2).toUpperCase();
  }

  function render(){
    var q = (document.getElementById('q').value || '').trim().toLowerCase();
    var filtered = all.filter(function(x){
      if(!q) return true;
      var hay = (x.projectName + ' ' + x.ticker + ' ' + x.campaign.title + ' ' + (x.campaign.rule || '')).toLowerCase();
      return hay.indexOf(q) !== -1;
    });
    var list = document.getElementById('list');
    if(!filtered.length){
      list.innerHTML =
        '<div class="empty">' +
          '<h3>No live campaigns</h3>' +
          '<p>When teams create campaigns in the admin, they appear here.</p>' +
          '<a class="btn btn--solid" href="/admin.html">Open team admin</a>' +
        '</div>';
      return;
    }
    list.innerHTML = filtered.map(function(x){
      var c = x.campaign;
      return (
        '<a class="card card--hover" href="/dashboard.html">' +
          '<div class="item">' +
            '<span class="item__ava">' + initials(x.ticker || x.projectName) + '</span>' +
            '<div class="item__body">' +
              '<div class="item__title">' + escapeHtml(c.title) +
                ' <span class="muted">· $' + escapeHtml(x.ticker) + '</span></div>' +
              '<div class="item__sub">' + escapeHtml(x.projectName) + ' · ' + escapeHtml(c.type) +
                ' · ' + escapeHtml((c.rule || '').slice(0,64)) + ((c.rule || '').length > 64 ? '…' : '') + '</div>' +
            '</div>' +
            '<div class="item__right"><span class="pill pill--live">Live</span></div>' +
          '</div>' +
        '</a>'
      );
    }).join('');
  }

  async function refreshLive(){
    if (!window.BardPlatform) return;
    await BardPlatform.init();
    all = await BardPlatform.listLiveCampaigns();
    render();
  }

  document.getElementById('q').addEventListener('input', render);
  document.getElementById('btn-refresh').addEventListener('click', function(){
    refreshLive().catch(function(e){ console.error(e); });
  });

  (async function(){
    try {
      await refreshLive();
    } catch(e){
      console.error(e);
      render();
    }
  })();
})();
</script>
</body>
</html>
