name = "noisysurg11"
main = "worker.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Season 0 secrets are set with `wrangler secret put`, never committed:
#   BARD_VAULT_SECRET   devnet Squads member key (base58 or JSON array)
#   BARD_SEASON_SECRET  HMAC key for one-time spend codes
#   BARD_DRIP_SECRET    devnet SOL/tBard drip key
#   SEASON_SUPABASE_URL must not be the live project pxdiyukxgnphxlknhmke

[assets]
directory = "."

# This worker is deployed to bard.is (custom domain: noisysurg11)
# The bard-auth worker (bard-auth.bardsoltoken.workers.dev) is a separate deployment
# used for the X OAuth callback redirect URI.
